name: Vendor upstream snapshots

on:
  push:
    paths:
      - "sources/upstreams.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone pinned source snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstreams
          mkdir -p upstreams
          declare -a SOURCES=(
            "anthropic-cookbook|anthropics/claude-cookbooks|d7265d6ae994ccd8429db0594b000073b2f9ad43"
            "claude-code|anthropics/claude-code|525d3b35312636cf8c001ecb3df2be0324a48b43"
            "anthropic-skills|anthropics/skills|8a1541c4a3ffa5a20a5a91de0dcf3f0bab1d1ef4"
            "wshobson-agents|wshobson/agents|156b7a5e7a8b93642628a339ee4039c925b34c7f"
            "system-prompts-and-models|x1xhlol/system-prompts-and-models-of-ai-tools|1e4203a7d88873c1b37ab2d1c07074fea498c274"
            "awesome-ai-agents|e2b-dev/awesome-ai-agents|9596ab1e69fbbb6c95291141c8dab5c181083216"
            "openai-agents-python|openai/openai-agents-python|28e9f4fca26dd1c7e679398b87182868ecfad714"
            "langgraph|langchain-ai/langgraph|4be610c6bc7c042038f671d6def9f523ca385a69"
            "crewai|crewAIInc/crewAI|ca1d55abb368cd24344de1ddad97bc493b21ffa0"
          )
          for source in "${SOURCES[@]}"; do
            IFS="|" read -r directory upstream commit <<< "$source"
            target="upstreams/$directory"
            git init "$target"
            git -C "$target" remote add origin "https://github.com/$upstream.git"
            git -C "$target" fetch --depth=1 origin "$commit"
            git -C "$target" checkout --detach FETCH_HEAD
            rm -rf "$target/.git"
          done

      - name: Commit source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add upstreams
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: vendor pinned upstream snapshots"
          git push
